name: frontend-cd

on:
  workflow_run:
    workflows: ["frontend-ci"]
    types: 
      - completed 
    branches: ["test-cicd-vitest"]
    
jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: ./chat-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ./chat-client/package-lock.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/juuphaada/realtime-chat-client:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/juuphaada/realtime-chat-client:latest
