name: Socket-CD

on:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/juuphaada/realtime-chat-socket:latest \
            ./chat-client

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/juuphaada/realtime-chat-socket:latest