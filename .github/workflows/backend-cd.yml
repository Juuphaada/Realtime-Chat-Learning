name: Backend-CD

on:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Convert repo owner name to lowercase
        run: echo "owner_name_lc=${{github.repository_owner}}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ env.owner_name_lc }}/realtime-chat-server:latest \
            ./chat-client

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ env.owner_name_lc }}/realtime-chat-server:latest