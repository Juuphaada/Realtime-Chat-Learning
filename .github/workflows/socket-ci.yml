name: Socket-CI

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  socket-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./socket

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ./socket/package-lock.json

      - run: npm ci

  socket-cd:
    needs: socket-ci
    uses: ./.github/workflows/socket-cd.yml